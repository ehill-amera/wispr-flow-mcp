[project]
name = "wispr-flow-mcp"
version = "0.1.0"
description = "Lets Claude search your Wispr Flow dictation history on your Mac, read-only and local, and keeps a permanent archive of it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
wispr-flow-mcp = "wispr_flow_mcp:main"
wispr-flow-archive = "wispr_flow_mcp.archive:main"
wispr-flow-recover = "wispr_flow_mcp.recover:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live"'
markers = ["live: reads the real Wispr Flow database, read-only (run with: pytest -m live --tb=no)"]
